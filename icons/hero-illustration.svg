<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration d'une personne qui court tranquillement dans la nature">
  <!-- colline douce en arrière-plan -->
  <path d="M-10 150 Q 100 118 210 148 T 410 132 L 410 220 L -10 220 Z" fill="#e3f3ea" />
  <path d="M-10 172 Q 120 150 220 172 T 410 162 L 410 220 L -10 220 Z" fill="#d3ecdf" />

  <!-- soleil avec halo -->
  <circle cx="336" cy="44" r="30" fill="#fff3d6" />
  <circle cx="336" cy="44" r="19" fill="#ffdd8a" />

  <!-- sol -->
  <path d="M0 196 Q 100 184 200 193 T 400 188" stroke="#bfe0cc" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- arbres (pointe en haut, base sur le tronc), profondeur croissante -->
  <g>
    <rect x="49" y="162" width="9" height="15" rx="2" fill="#9c7b57" />
    <polygon points="54,120 30,162 78,162" fill="#a8ddc2" />
    <polygon points="54,98 38,134 70,134" fill="#8fd0ac" />
  </g>
  <g>
    <rect x="344" y="170" width="11" height="19" rx="2" fill="#8a6b4a" />
    <polygon points="350,122 320,170 380,170" fill="#7fc79e" />
    <polygon points="350,98 330,138 370,138" fill="#6fc094" />
  </g>
  <g>
    <rect x="384" y="182" width="8" height="13" rx="2" fill="#9c7b57" />
    <polygon points="388,146 370,182 406,182" fill="#cdeedb" />
  </g>

  <!-- silhouette : jogging tranquille, trait épais pour plus de présence -->
  <g fill="none" stroke="#1b5e40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 112 L 171 150" />
    <path d="M171 150 L 154 170 L 142 189" />
    <path d="M171 150 L 194 174 L 206 193" />
    <path d="M177 116 L 158 130 L 146 118" />
    <path d="M177 116 L 196 134 L 202 154" />
  </g>
  <circle cx="179" cy="97" r="14" fill="#1b5e40" />
</svg>
