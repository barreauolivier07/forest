<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration d'un coureur en entraînement fractionné">
  <!-- ciel / halo de soleil -->
  <circle cx="336" cy="42" r="28" fill="#fff3d6" />
  <circle cx="336" cy="42" r="17" fill="#ffdd8a" />

  <!-- route / piste -->
  <path d="M-10 180 Q 200 168 410 180 L 410 206 Q 200 194 -10 206 Z" fill="#dbe8e0" />
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="192" x2="60" y2="191" />
    <line x1="110" y1="190" x2="140" y2="190" />
    <line x1="190" y1="190" x2="220" y2="190" />
    <line x1="270" y1="191" x2="300" y2="192" />
    <line x1="350" y1="193" x2="380" y2="195" />
  </g>

  <!-- fanions d'intervalle -->
  <g>
    <line x1="96" y1="196" x2="96" y2="168" stroke="#8a6b4a" stroke-width="3" stroke-linecap="round" />
    <polygon points="96,168 118,176 96,184" fill="#6fc094" />
  </g>
  <g>
    <line x1="252" y1="197" x2="252" y2="169" stroke="#8a6b4a" stroke-width="3" stroke-linecap="round" />
    <polygon points="252,169 274,177 252,185" fill="#8fd0ac" />
  </g>

  <!-- lignes de vitesse -->
  <g stroke="#bfe0cc" stroke-width="6" stroke-linecap="round">
    <line x1="30" y1="128" x2="66" y2="128" />
    <line x1="20" y1="146" x2="62" y2="146" />
    <line x1="34" y1="164" x2="64" y2="164" />
  </g>

  <!-- silhouette : sprint dynamique -->
  <g fill="none" stroke="#1b5e40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 96 L 199 140" />
    <path d="M199 140 L 235 156 L 258 132" />
    <path d="M199 140 L 158 165 L 128 196" />
    <path d="M212 100 L 250 84 L 272 58" />
    <path d="M212 100 L 178 118 L 156 106" />
  </g>
  <circle cx="215" cy="76" r="18" fill="#1b5e40" />
</svg>
